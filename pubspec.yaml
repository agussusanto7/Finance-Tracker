name: flutter_application_1
description: "Aplikasi Management Keuangan Pribadi dengan UI BNI Mobile Banking"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.1

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3+2
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3

  # Charts & Graphs
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  local_auth: ^2.3.0

  # Animations
  animations: ^2.0.11
  flutter_speed_dial: ^7.0.0
  google_generative_ai: ^0.4.7
  flutter_markdown: ^0.7.7+1
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  google_sign_in: 6.2.1
  math_expressions: ^3.1.0
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/lottie/
    - .env
